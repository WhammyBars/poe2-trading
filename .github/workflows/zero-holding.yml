name: Zero out a holding

# Manual-only. Removes every logged purchase entry for one item_key from the
# encrypted purchase log (docs/purchases.enc.json), zeroing that item's held
# quantity. Use after selling out of a position that was tracked as a
# holding. The password never leaves GitHub's secret store.
on:
  workflow_dispatch:
    inputs:
      item_key:
        description: "category:itemId of the holding to zero out, e.g. Fragments:origin-core"
        required: true

permissions:
  contents: write

jobs:
  zero-holding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Zero out the holding
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          ZERO_ITEM_KEY: ${{ inputs.item_key }}
        run: node --disable-warning=ExperimentalWarning src/zeroHoldingCi.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/purchases.enc.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Zero out holding: ${{ inputs.item_key }}"
            git push
          fi
