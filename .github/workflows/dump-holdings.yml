name: Dump holdings (debug)

# Manual-only, read-only diagnostic. Prints every raw purchase entry and the
# aggregated holdings to the Actions log so a mismatch can be debugged
# without ever decrypting the purchase log locally. Makes no changes to the
# repo (no commit step).
on:
  workflow_dispatch:

jobs:
  dump-holdings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Print raw purchases and aggregated holdings
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: node --disable-warning=ExperimentalWarning src/dumpHoldingsCi.js
